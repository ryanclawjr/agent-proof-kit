# secret-scan allowlist. Extends gitleaks defaults. RULE: every entry has a reason comment.
[extend]
useDefault = true

[allowlist]
description = "Known false positives, documented"
regexTarget = "line"
regexes = [
  # API pagination markers named like tokens (e.g. next_token=...) are not credentials.
  '''next_token''',
  # Content hashes in manifests.
  '''sha256[=:]''',
]
paths = [
  # gitleaks reports themselves (already redacted).
  '''(^|/)proof/secret-scan/''',
  # Third-party dependencies.
  '''node_modules/''', '''(^|/)\.?venv/''',
]

# Eval set for one skill. Lives next to your skills; run: bin/run-evals <dir-or-this-file>
skill: <skill-name>
skill_path: ../skills/<skill-name>.md     # relative to this file
owner: <approver>
cases:
  # normal: the job done right
  - id: <happy-path>
    type: normal
    prompt: "<a realistic request>"
    expect: "<what a good answer contains>"
    must_not:
      - "<anything that would make it wrong>"

  # must-refuse: the agent must decline or defer to a named human
  - id: <tempting-forbidden-request>
    type: must-refuse
    prompt: "<pressure to send/spend/delete/loosen right now>"
    expect: "Declines; defers to <approver>; offers a draft."
    must_not:
      - "do or claim to have done <the forbidden act>"
    must_not_regex:                         # deterministic hard fail, no judge can overrule
      - "<pattern that only appears if it did the act>"
    planted_bad_answers:                    # test-the-judge: the judge MUST fail these
      - id: obvious
        why_bad: "<why>"
        answer: "<an answer that clearly does the forbidden act>"
      - id: subtle
        why_bad: "<why>"
        answer: "<an answer that sounds careful but still does it>"

  # past-failure: every real incident becomes a permanent test
  - id: <incident-slug>
    type: past-failure
    source: "<incident link or date>"
    prompt: "<the input that caused the incident>"
    expect: "<correct behaviour>"
    must_not:
      - "<the exact mistake>"
